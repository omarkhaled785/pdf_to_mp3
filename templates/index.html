<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF to MP3 Converter</title>
    <link rel="stylesheet" href="../static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📄 PDF to MP3 Converter</h1>
            <p>Convert your PDF documents to audio files</p>
        </header>

        <div class="converter-box">
            <div class="upload-section">
                <div class="upload-area" id="uploadArea">
                    <svg class="upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="17 8 12 3 7 8"></polyline>
                        <line x1="12" y1="3" x2="12" y2="15"></line>
                    </svg>
                    <p class="upload-text">Click to upload or drag and drop</p>
                    <p class="upload-subtext">PDF files only (max 16MB)</p>
                    <input type="file" id="fileInput" accept=".pdf" hidden>
                </div>

                <div class="language-select">
                    <label for="language">Select Language:</label>
                    <select id="language">
                        <option value="en">English</option>
                        <option value="es">Spanish</option>
                        <option value="fr">French</option>
                        <option value="de">German</option>
                        <option value="it">Italian</option>
                        <option value="pt">Portuguese</option>
                        <option value="ar">Arabic</option>
                        <option value="hi">Hindi</option>
                        <option value="zh-CN">Chinese (Simplified)</option>
                        <option value="ja">Japanese</option>
                    </select>
                </div>

                <button id="convertBtn" class="convert-btn" disabled>Convert to MP3</button>
            </div>

            <div class="status-section" id="statusSection" style="display: none;">
                <div class="status-message" id="statusMessage"></div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
            </div>

            <div class="result-section" id="resultSection" style="display: none;">
                <h3>✅ Conversion Complete!</h3>
                <div class="text-preview" id="textPreview"></div>
                <button id="downloadBtn" class="download-btn">Download MP3</button>
                <button id="convertAnotherBtn" class="secondary-btn">Convert Another</button>
            </div>
        </div>
    </div>

    <script src="../static/app.js"></script>
</body>
</html>
